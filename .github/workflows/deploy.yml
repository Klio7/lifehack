name: Build and Deploy

on:
  push:
    branches: [main] # Автоматически запускать процесс при пуше в main
  pull_request:
    branches: [main] # Запускать при создании PR в main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test # если есть тесты

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Папка, созданная билдом Vite
          # Можно добавить другие настройки, например, custom domain и многое другое
